<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumen Trace</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="masthead">
        <div class="identity" aria-label="Lumen Trace">
          <span class="aperture" aria-hidden="true"><i></i></span>
          <span>
            <strong>Lumen Trace</strong>
            <small>POST-PROCESS READER</small>
          </span>
        </div>
        <span class="version">WEB EXT · 0.5.0</span>
      </header>

      <section class="viewfinder" aria-live="polite">
        <div class="image-stage" id="imageStage">
          <img id="preview" alt="偵測到的貼文圖片預覽" hidden />
          <div class="empty-state" id="emptyState">
            <span class="focus-mark" aria-hidden="true"></span>
            <p id="emptyTitle">正在尋找貼文圖片</p>
            <small id="emptyHint">請停留在 X 或 Instagram 的貼文畫面</small>
          </div>
          <span class="scan-line" aria-hidden="true"></span>
          <span class="corner corner-tl" aria-hidden="true"></span>
          <span class="corner corner-tr" aria-hidden="true"></span>
          <span class="corner corner-bl" aria-hidden="true"></span>
          <span class="corner corner-br" aria-hidden="true"></span>
        </div>

        <div class="readout">
          <span class="source"><i id="statusDot"></i><b id="sourceLabel">SCANNING</b></span>
          <span class="dimensions" id="dimensions">— × —</span>
        </div>
      </section>

      <section class="analysis-map" id="analysisMap" aria-label="分析內容">
        <span><i class="tone"></i>明暗曲線</span>
        <span><i class="color"></i>色彩分離</span>
        <span><i class="detail"></i>局部質感</span>
      </section>

      <ol class="handoff-steps" id="handoffSteps" aria-label="ChatGPT 交接進度">
        <li id="photoStep"><b>1</b><span>複製照片</span></li>
        <li id="pasteStep"><b>2</b><span>貼出縮圖</span></li>
        <li id="promptStep"><b>3</b><span>加入提示</span></li>
      </ol>

      <label class="confirm-row" id="photoConfirmRow" hidden>
        <input id="photoConfirmed" type="checkbox" />
        <span>我已在 ChatGPT 看到照片縮圖</span>
      </label>

      <div class="actions">
        <button class="primary" id="primaryButton" type="button" aria-describedby="message" disabled>
          <span class="cta-label" id="primaryLabel">複製照片 <small id="primaryBadge">PNG ONLY</small></span>
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M4 10h11M11 6l4 4-4 4" />
          </svg>
        </button>

        <button class="secondary" id="secondaryButton" type="button" aria-describedby="message" disabled>
          <span id="secondaryLabel">在網站開啟</span>
          <small id="secondaryMeta">不會自動送出</small>
        </button>
      </div>

      <p class="message" id="message" role="status" aria-live="polite">先只複製照片；看到 ChatGPT 縮圖後，再回來複製分析提示。</p>

      <footer>
        <span>不讀對話內容、Cookie、私訊或紀錄</span>
        <kbd>⌘ ⇧ L</kbd>
      </footer>
    </main>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
